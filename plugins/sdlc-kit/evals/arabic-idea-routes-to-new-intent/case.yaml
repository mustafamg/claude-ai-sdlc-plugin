schema_version: "1.1"
name: arabic-idea-routes-to-new-intent
description: An idea told in Arabic, without the slash command, still routes to new-intent and gets an Arabic reply.
tags: [trigger, language]
runs: 3

execution:
  prompt: |
    عندي فكرة عايز أكتبها كويس: المستخدم يقدر يصدّر اللوحة كملف PDF، عشان يبعتها للعملاء اللي مش
    بيستخدموا المنتج. ممكن تمسكها من هنا؟
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]

graders:
  - name: new-intent-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:sdlc-kit:)?new-intent"'
    min: 1
    weight: 2.0

  - name: review-intent-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:sdlc-kit:)?review-intent"'
    min: 0
    max: 0
    arm: both
    weight: 1.0

  - name: replies-in-arabic
    type: llm
    focus: last_message
    weight: 1.0
    criteria: |
      The user wrote in Arabic. PASS if the reply is in Arabic. Technical words (intent, PDF, init)
      may stay in English inside Arabic sentences, and file paths or commands may be English. FAIL
      if the reply is mainly in English.
