schema_version: "1.1"
name: defer-outcome
description: A sound but not-now intent should be deferred with a revisit month, not rejected.
tags: [behavior]
runs: 2

execution:
  prompt: |
    Can you review intent/2026-02-02-guest-access/intent.md? The idea is right and I want to
    keep it, but we can't take it on this quarter — the team is full until the billing work lands.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]

context:
  scaffold_script: setup.sh

graders:
  - name: review-intent-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:sdlc-kit:)?review-intent"'
    min: 1
    weight: 1.0

  - name: defers-with-a-revisit-month
    type: llm
    focus: last_message
    weight: 3.0
    criteria: |
      The user says the intent is sound but can't be worked on this quarter.

      PASS if BOTH hold:
      1. It treats the intent as deferred rather than rejected or accepted. Any of these count:
         proposing `Status: deferred`, referring to "the deferred status", or plainly describing the
         intent as deferred, parked, or going to the backlog. The exact string `Status: deferred`
         is NOT required.
      2. It asks for, or proposes, a revisit month (a `YYYY-MM` style date or a named month) and/or
         who revisits it. A question asking the user for that month counts — it does not have to
         supply one itself.

      The response may spend most of its length on other gaps in the intent, and may end on
      questions. That does not affect the verdict: judge only the two points above.

      FAIL if the response rejects the intent, marks it accepted, closes it as not-doing, leaves the
      status alone without raising deferral, or defers with no revisit month and no question about
      one.
