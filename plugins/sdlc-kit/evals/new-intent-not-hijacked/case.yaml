schema_version: "1.1"
name: new-intent-not-hijacked
description: A fresh idea must still route to new-intent; review-intent must not steal it.
tags: [trigger]
runs: 3

execution:
  prompt: |
    I have an idea I want to get written up properly: letting people export a board as a PDF, so they
    can send it to clients who don't use the product. Can you take it from here?
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]

graders:
  - name: new-intent-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:sdlc-kit:)?new-intent"'
    min: 1
    weight: 2.0

  - name: review-intent-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:sdlc-kit:)?review-intent"'
    min: 0
    max: 0
    weight: 2.0
